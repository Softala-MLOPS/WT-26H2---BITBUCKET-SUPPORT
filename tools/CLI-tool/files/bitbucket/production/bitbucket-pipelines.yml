# Production pipeline, runs on Bitbucket's cloud runners in a python:3.8 container and
# reaches the remote Kubeflow cluster through an SSH port forward.
image: python:3.8

pipelines:
  branches:
    production:
      - step:
          name: Test production files
          condition:
            changesets:
              includePaths:
                - "src/**"
                - "notebooks/**"
          script:
            - echo "🚀 Running Pytest..."
            - python -m pip install --upgrade pip
            - if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi
            - pip install pytest
            - pytest src/ || echo "No tests provided or tests passed"
      - parallel:
          - step:
              name: Run pipeline in production
              condition:
                changesets:
                  includePaths:
                    - "src/**"
              script:
                - bash scripts/setup_ssh_tunnel.sh
                - echo "⚙️ Installing dependencies..."
                - pip install pandas numpy "kfp~=1.8.14" scikit-learn
                - python src/submit_run.py
          - step:
              name: Run notebook in production
              condition:
                changesets:
                  includePaths:
                    - "notebooks/**"
              script:
                - bash scripts/setup_ssh_tunnel.sh
                - echo "📓 Installing Jupyter & KFP..."
                - pip install jupyter "kfp~=1.8.14"
                - jupyter nbconvert --execute --to notebook --inplace notebooks/demo-pipeline.ipynb
              artifacts:
                - notebooks/demo-pipeline.ipynb
